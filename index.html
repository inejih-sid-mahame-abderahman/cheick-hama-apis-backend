<!DOCTYPE html>

<head>

        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 10px; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }

    </style>
</head>

<div id="techModal" class="fixed inset-0 bg-black/85 z-[9999] hidden items-center justify-center p-4 backdrop-blur-sm" onclick="if(event.target===this) closeTechModal()">
    <div class="bg-white rounded-3xl w-full max-w-5xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl animate-entry">
        <div class="bg-gradient-to-r from-red-50 to-white px-6 py-4 border-b flex justify-between items-center sticky top-0">
            <div class="flex items-center gap-3 flex-wrap">
                <span id="modalPhaseTag" class="bg-red-700 text-white text-xs font-bold px-4 py-1.5 rounded-full"></span>

                <div><h3 class="text-red-800 font-bold text-sm uppercase tracking-wider"><i class="fa-solid fa-database"></i> النماذج المرتبطة</h3><div id="modalModels" class="flex flex-wrap gap-2 mt-2"></div></div>
                <div class="bg-gradient-to-r from-slate-100 to-red-50 p-4 rounded-2xl"><h3 class="font-bold text-red-800"><i class="fa-solid fa-diagram-project"></i> تدفق البيانات</h3><p id="modalFlow" class="text-sm text-slate-800 mt-2 font-mono"></p></div>
                <button onclick="closeTechModal()" class="w-full bg-red-700 hover:bg-red-800 text-white py-3 rounded-2xl font-bold">إغلاق</button>

    </div>
</div>

   { key: "phase13", name: "📊 PHASE 12: إدارة الشراء (Admin Purchase Management)", icon: "fa-chart-line", color: "purple" },

const screensDB = [

    { id: 24, src: "saller screens saller home screen .jpeg", title: "لوحة تحكم البائع", phase: "phase4", desc: "قائمة الحيوانات المعروضة", apis: [{ method: "GET", path: "/seller/animals/", desc: "حيواناتي" }], models: ["Animal"], flow: "Seller dashboard" },
    { id: 25, src: "saller screens animal publishing screen step 1.jpeg", title: "إضافة حيوان - الخطوة 1", phase: "phase9", desc: "اختيار نوع الحيوان", apis: [{ method: "POST", path: "/animals/create/", desc: "بدء إضافة حيوان" }], models: ["Animal"], flow: "Step 1: Type selection" },
    { id: 26, src: "saller screens animal publishing screen step 2.jpeg", title: "إضافة حيوان - السعر والوصف", phase: "phase9", desc: "تحديد السعر والوزن والوصف", apis: [{ method: "PATCH", path: "/animals/{id}/", desc: "تحديث بيانات الحيوان" }], models: ["Animal"], flow: "Step 2: Price & description" },
    { id: 27, src: "saller screens animal publishing screen step 3.jpeg", title: "إضافة حيوان - الصور والموقع", phase: "phase9", desc: "رفع الصور والفيديو + الموقع", apis: [{ method: "POST", path: "/animals/{id}/media/", desc: "رفع وسائط" }], models: ["AnimalMedia"], flow: "Upload images + set location" },
    { id: 28, src: "saller screens animal publishing screen animal publishing confirmaion screnandpending screen last step.jpeg", title: "قيد المراجعة (Pending Approval)", phase: "phase9", desc: "انتظار موافقة الإدارة بعد نشر الحيوان", apis: [{ method: "GET", path: "/users/me/", desc: "حالة الحساب" }], models: ["Utilisateur", "Profile*"], flow: "Check est_approuve field" },
    { id: 29, src: "saller screens animal qr code screen for the delevery guy to scanit and pick up anil form saller.jpeg", title: "رمز QR لاستلام الحيوان من البائع", phase: "phase4", desc: "إظهار QR للسائق", apis: [{ method: "GET", path: "/animals/{id}/pickup-qr/", desc: "QR للاستلام" }], models: ["Animal"], flow: "Driver scans at seller location" },

    // PHASE 5: Butcher
    { id: 29, src: "bucher screens bucher home screen.jpeg", title: "لوحة الجزار", phase: "phase5", desc: "الطلبات المعلقة", apis: [{ method: "GET", path: "/butcher/preparations/", desc: "طلبات التجهيز" }], models: ["Preparation"], flow: "Butcher dashboard" },
    { id: 30, src: "bucher screens qr code screen.jpeg", title: "لوحة الجزار", phase: "phase5", desc: "الطلبات المعلقة", apis: [{ method: "GET", path: "/butcher/preparations/", desc: "طلبات التجهيز" }], models: ["Preparation"], flow: "Butcher dashboard" },
   // PHASE 12: Admin Purchase Management

        ],

    },
   
    { 
        id: 43, 
        src: "Admin_pages web_dashboard admin otp verificaiton page.png.jpeg", 
        title: "إدارة الاستردادات والنزاعات", 
        phase: "phase12", 
        desc: "مراقبة طلبات الاسترداد، النزاعات بين البائع والمشتري، واتخاذ القرارات الإدارية", 
        apis: [
            { method: "GET", path: "/admin/disputes/", desc: "قائمة جميع النزاعات المفتوحة" },
            { method: "POST", path: "/admin/disputes/{id}/resolve/", desc: "حل النزاع لصالح طرف" },
            { method: "POST", path: "/admin/refunds/approve/", desc: "الموافقة على طلب استرداد" },
            { method: "POST", path: "/admin/refunds/reject/", desc: "رفض طلب استرداد" }
        ], 
        models: ["Dispute", "RefundRequest", "Commande"], 
        flow: "يتيح للمشرف متابعة النزاعات، التواصل مع الأطراف، وإصدار أحكام استرداد الأموال إذا لزم الأمر." 
    },
   
  
   
  
   
   
  
    { 
        id: 49, 
        src: "Admin_pages web_dashboard listings manegments page.png", 
        title: "سجل التدقيق والمراجعة", 
        phase: "phase12", 
        desc: "تتبع جميع التغييرات التي أجرها المشرفون على المشتريات وأذونات النظام", 
        apis: [
            { method: "GET", path: "/admin/audit-logs/", desc: "عرض سجل التعديلات" },
            { method: "GET", path: "/admin/audit-logs/{id}/", desc: "تفاصيل تدقيق محددة" }
        ], 
        models: ["AuditLog", "AdminAction"], 
        flow: "كل عملية تعديل على حالة الشراء أو النزاع تسجل تلقائيًا مع وقت التنفيذ واسم المشرف." 
    }
   
    
];
let currentPhaseFilter = "all";

function renderFilters() {
    const container = document.getElementById("phaseFilterButtons");
    const myPhases = ["phase0", "phase4", "phase5", "phase9"];
    const filteredPhases = phasesMeta.filter(p => myPhases.includes(p.key));
    container.innerHTML = `<button onclick="setPhaseFilter('all')" class="px-6 py-3 rounded-full font-bold transition-all ${currentPhaseFilter==='all' ? 'bg-red-700 text-white shadow-lg' : 'bg-white border text-slate-700'}">جميع شاشاتي (${screensDB.length})</button>${filteredPhases.map(p => `<button onclick="setPhaseFilter('${p.key}')" class="px-6 py-3 rounded-full font-bold transition-all ${currentPhaseFilter===p.key ? 'bg-red-700 text-white shadow-lg' : 'bg-white border text-slate-700'}">${p.name}</button>`).join('')}`;
}

function setPhaseFilter(phase) { currentPhaseFilter = phase; renderFilters(); renderScreens(); }

function renderScreens() {
    let filtered = currentPhaseFilter === "all" ? screensDB : screensDB.filter(s => s.phase === currentPhaseFilter);
    const container = document.getElementById("screensContainer");
    if (filtered.length === 0) { container.innerHTML = `<div class="text-center p-20 text-slate-500">لا توجد شاشات في هذا الفلتر</div>`; return; }
    const grouped = {};
    filtered.forEach(s => { if (!grouped[s.phase]) grouped[s.phase] = []; grouped[s.phase].push(s); });
    let html = '';
    phasesMeta.forEach(phaseInfo => {
        const group = grouped[phaseInfo.key];
        if (!group || group.length === 0) return;
        html += `<div class="mb-16"><div class="phase-header pr-6 mb-6 p-5 rounded-2xl"><h2 class="text-2xl font-black flex items-center gap-4"><i class="fa-solid ${phaseInfo.icon} text-3xl text-red-600"></i>${phaseInfo.name} <span class="text-red-600">(${group.length})</span></h2></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">`;
        group.forEach(screen => {
            html += `<div class="screen-card bg-white rounded-3xl overflow-hidden shadow" onclick='showTechModal(${JSON.stringify(screen)})'><img src="${screen.src}" class="w-full aspect-[9/19] object-cover" alt="${screen.title}" onerror="this.src='https://placehold.co/300x570?text=${encodeURIComponent(screen.title)}'"><div class="p-5"><h3 class="font-bold text-lg leading-tight">${screen.title}</h3><p class="text-sm text-slate-600 mt-2 line-clamp-3">${screen.desc}</p></div></div>`;
        });
        html += `</div></div>`;
    });
    container.innerHTML = html;
}

window.showTechModal = function(screen) {
    document.getElementById("modalTitle").innerText = screen.title;
    document.getElementById("modalImg").src = screen.src;
    document.getElementById("modalDesc").innerText = screen.desc;
    const phaseObj = phasesMeta.find(p => p.key === screen.phase);
    document.getElementById("modalPhaseTag").innerHTML = `<i class="fa-solid ${phaseObj?.icon || 'fa-circle'}"></i> ${phaseObj?.name || screen.phase}`;
    let apisHTML = screen.apis && screen.apis.length > 0 ? screen.apis.map(api => `<div class="flex gap-3 items-start"><span class="badge-${api.method.toLowerCase()} text-white text-xs font-bold px-3 py-1 rounded">${api.method}</span><div><code class="text-red-600 font-medium">/api/v1${api.path}</code><p class="text-xs text-slate-500 mt-1">${api.desc}</p></div></div>`).join('') : '<p class="text-slate-400">لم يتم تحديد APIs بعد</p>';
    document.getElementById("modalApis").innerHTML = apisHTML;
    document.getElementById("modalModels").innerHTML = (screen.models || []).map(m => `<span class="bg-red-100 text-red-800 px-4 py-1.5 rounded-2xl text-sm">${m}</span>`).join('');
    document.getElementById("modalFlow").innerText = screen.flow || "تدفق البيانات يتم تحديده حسب المتطلبات النهائية";
    const modal = document.getElementById("techModal");
    modal.classList.remove("hidden");
    modal.style.display = "flex";
};

window.closeTechModal = function() { const modal = document.getElementById("techModal"); modal.style.display = "none"; modal.classList.add("hidden"); };
function init() { renderFilters(); renderScreens(); }
init();
</script>
</body>
</html>
